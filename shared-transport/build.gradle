// Shared Transport Module — UFO Galaxy Android
// Extracted from :app to enable reuse by Wear OS and other subsystems.
// Contains: GatewayClient interface, AipTransportManager, and transport adapters.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ufo.galaxy.transport'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Shared protocol module (AipMessage, AuthMessage, MsgType)
    api project(':shared-protocol')

    // Kotlin coroutines (for CancellationException handling)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // AndroidX Core (for Log)
    implementation 'androidx.core:core-ktx:1.12.0'

    // 单元测试。此前本模块【一个测试都没有,也没有测试源集】—— 而手表端整条网关
    // 通路都编译的是这里的代码。GatewayAddressTest 随 GatewayAddress 一起搬进来,
    // 并在 CI 里显式跑 :shared-transport:testDebugUnitTest(既有工作流只跑
    // :app:testDebugUnitTest,不加这一步等于把一组正在跑的用例悄悄关掉)。
    testImplementation 'junit:junit:4.13.2'
}
